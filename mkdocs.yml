site_name: Iyrin Documentation
site_description: Documentation for Iyrin, a Streamlit application for geospatial analysis, scientific data, Live World operational intelligence, document processing, embeddings, vector storage, and multi-provider AI workflows.
site_author: Terry D. Eppler
site_url: https://is-leeroy-jenkins.github.io/Iyrin/
docs_dir: docs

repo_url: https://github.com/is-leeroy-jenkins/Iyrin
repo_name: is-leeroy-jenkins/Iyrin
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/map-search

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/iyrin.css

extra_javascript:
  - assets/js/iyrin.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - User Guide:
      - Overview: user-guide/index.md
      - Mapping Tools: user-guide/mapping-tools.md
      - Interactive Map: user-guide/interactive-map.md
      - Site Crawler: user-guide/site-crawler.md
      - Document Data: user-guide/document-data.md
      - Geoscience Data: user-guide/geoscience-data.md
      - Astronomical Data: user-guide/astronomical-data.md
      - Celestial Map: user-guide/celestial-map.md
      - Public Health: user-guide/public-health.md
      - Artificial Intelligence: user-guide/artificial-intelligence.md
      - File Upload: user-guide/file-upload.md
      - Data Management: user-guide/data-management.md
  - Live World:
      - Overview: live-world/index.md
      - Operational Layers: live-world/layers.md
      - Spatial Analysis & Geofencing: live-world/analysis.md
      - Historical Replay: live-world/history.md
      - Agent Tools: live-world/agent-tools.md
  - AI / ML Processing: processing.md
  - Configuration: configuration.md
  - API Reference:
      - Overview: api/index.md
      - Geospatial API: api/geospatial.md
      - AI / Processing API: api/processing.md
      - Live World API: api/live-world.md
  - Development: development.md
