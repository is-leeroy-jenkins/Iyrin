name: App Audit Demographics

on:
  push:
    branches:
      - app-audit-demographics

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply corrections
        run: python .github/scripts/correct_app_execution_paths.py
      - name: Install audit tools
        run: python -m pip install pyflakes
      - name: Compile repository
        run: python -m compileall -q .
      - name: Audit undefined names
        shell: bash
        run: |
          set -o pipefail
          pyflakes app.py pipelines.py processors.py loaders.py fetchers.py generators.py 2>&1 | tee pyflakes.log || true
          if grep -E "undefined name|referenced before assignment" pyflakes.log; then
            exit 1
          fi
      - name: Validate configured modes
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          config_text = Path('config.py').read_text(encoding='utf-8')
          app_text = Path('app.py').read_text(encoding='utf-8')
          module = ast.parse(config_text)
          modes = []
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'MODES':
                          modes = ast.literal_eval(node.value)
          missing = []
          for mode in modes:
              pattern = rf"(?:if|elif)\s+mode\s*==\s*['\"]{re.escape(mode)}['\"]"
              if not re.search(pattern, app_text):
                  missing.append(mode)
          if missing:
              raise SystemExit(f'Missing mode execution paths: {missing}')
          print(f'Validated {len(modes)} configured mode execution paths.')
          PY
      - name: Validate processing contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          app = ast.parse(Path('app.py').read_text(encoding='utf-8'))
          bad = []
          for node in ast.walk(app):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  if node.func.id == 'render_source_processing_controls' and len(node.args) != 5:
                      bad.append((node.lineno, len(node.args)))
          if bad:
              raise SystemExit(f'Invalid render_source_processing_controls calls: {bad}')
          print('Processing call signatures OK.')
          PY
      - name: Validate demographics symbols
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          fetchers = Path('fetchers.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          pipelines = Path('pipelines.py').read_text(encoding='utf-8')
          required_fetchers = ['CensusData', 'Socrata', 'HealthData', 'GlobalHealthData',
                               'UnitedNations', 'WorldPopulation', 'Wonder']
          for name in required_fetchers:
              if f'class {name}' not in fetchers:
                  raise SystemExit(f'Missing demographic fetcher: {name}')
              if name not in app:
                  raise SystemExit(f'Missing application import/use: {name}')
          for name in ['clear_loader_documents', 'promote_loader_documents', 'sync_mode_document']:
              if name not in pipelines:
                  raise SystemExit(f'Missing processing helper: {name}')
              if name not in app:
                  raise SystemExit(f'Missing application processing use: {name}')
          ast.parse(app)
          print('Demographic execution contracts OK.')
          PY
      - name: Validate dependency manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          requirements = set(Path('requirements.txt').read_text(encoding='utf-8').splitlines())
          required = {'python-docx', 'gensim', 'scikit-learn', 'spacy', 'textblob', 'tiktoken', 'lxml'}
          missing = sorted(required - requirements)
          if missing:
              raise SystemExit(f'Missing processor dependencies: {missing}')
          print('Processor dependency manifest OK.')
          PY
      - name: Commit corrections
        run: |
          git config user.name "is-leeroy-jenkins"
          git config user.email "terry.eppler@gmail.com"
          git add app.py pipelines.py fetchers.py requirements.txt
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Correct application execution paths and demographics mode"
            git push origin HEAD:app-audit-demographics
          fi
