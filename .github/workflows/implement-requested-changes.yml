name: Implement Requested Changes

on:
  push:
    branches:
      - fix/geocoding-fetcher-ui-audit
    paths:
      - .github/scripts/add_open_science_ui.py
      - .github/workflows/implement-requested-changes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geocoding-fetcher-ui-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add Open Science UI integration
        run: python .github/scripts/add_open_science_ui.py
      - name: Validate syntax and integration
        run: |
          python -m compileall -q app.py
          python - <<'PY'
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          required = [
              'OpenScience',
              "with st.expander( '🧬 NASA Open Science Data'",
              "service = OpenScience( )",
              "'NASA Open Science Data', 'astro_open_science'",
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit(f'Missing Open Science contracts: {missing}')
          PY
      - name: Commit application changes
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes were produced.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add app.py
          git commit -m 'Expose NASA Open Science Data in Astronomical mode'
          git push origin fix/geocoding-fetcher-ui-audit
