name: Apply Location State Authority Fix

on:
  push:
    branches:
      - fix/location-state-authority

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.head_commit.message != 'Correct active location state authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-state-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          app = path.read_text(encoding='utf-8')

          init_anchor = "if 'active_location_source' not in st.session_state:\n\tst.session_state[ 'active_location_source' ] = ''\n"
          init_replacement = init_anchor + "\nif 'browser_location_signature' not in st.session_state:\n\tst.session_state[ 'browser_location_signature' ] = ''\n"
          if init_anchor not in app:
              raise SystemExit('Active location state initialization anchor not found.')
          app = app.replace(init_anchor, init_replacement, 1)

          app = app.replace("def get_global_location_default( fallback: str = 'Washington, DC' ) -> str:",
                            "def get_global_location_default( fallback: str = '' ) -> str:", 1)
          app = app.replace("def get_global_latitude_default( fallback: float = 38.907200 ) -> float:",
                            "def get_global_latitude_default( fallback: float = 0.0 ) -> float:", 1)
          app = app.replace("def get_global_longitude_default( fallback: float = -77.036900 ) -> float:",
                            "def get_global_longitude_default( fallback: float = 0.0 ) -> float:", 1)

          def replace_function(text, name, replacement):
              pattern = rf'^def {name}\(.*?(?=^def |^# ------------- VISUALIZATION UTILITIES|\Z)'
              match = re.search(pattern, text, re.M | re.S)
              if not match:
                  raise SystemExit(f'Function {name} not found.')
              return text[:match.start()] + replacement.rstrip() + '\n\n' + text[match.end():]

          bootstrap = r'''def bootstrap_browser_geolocation( geocoder: Geocoder ) -> None:
	"""
	
		Purpose:
		--------
		Request browser geolocation and keep the canonical global Location State synchronized
		with the browser coordinates before location-dependent modes render.

		Parameters:
		-----------
		geocoder (Geocoder): Existing geocoder instance used to reverse geocode browser coordinates.

		Returns:
		--------
		None
		
	"""
	try:
		if not st.session_state.get( 'browser_geolocation_enabled', True ):
			return
		
		if st.session_state.get( 'browser_geolocation_permission_denied', False ):
			return
		
		browser_loaded = bool( st.session_state.get( 'browser_geolocation_loaded', False ) )
		geo_payload = st.session_state.get( 'browser_geolocation', None ) if browser_loaded else get_geolocation( )
		
		if not geo_payload:
			return
		
		state_changed = False
		if not browser_loaded:
			if not update_location_state_from_browser_geolocation( geo_payload ):
				return
			state_changed = True
		
		coords = geo_payload.get( 'coords', { } ) if isinstance( geo_payload, dict ) else { }
		latitude = coords.get( 'latitude', None )
		longitude = coords.get( 'longitude', None )
		if not has_valid_coordinates( latitude, longitude ):
			return
		
		latitude = float( latitude )
		longitude = float( longitude )
		signature = f'{latitude:.6f},{longitude:.6f}'
		resolved_signature = str( st.session_state.get( 'browser_location_signature', '' ) or '' )
		location_text = str( st.session_state.get( 'location', '' ) or '' ).strip( )
		active_source = str( st.session_state.get( 'active_location_source', '' ) or '' ).strip( )
		needs_resolution = (resolved_signature != signature or not location_text or active_source != 'browser')
		
		if needs_resolution:
			try:
				result = geocoder.reverse( latitude, longitude ) if geocoder is not None else { }
				result = result or { }
				locality = str( result.get( 'locality', '' ) or '' ).strip( )
				region = str( result.get( 'admin_level_1', '' ) or '' ).strip( )
				location_parts = [ part for part in [ locality, region ] if part ]
				location_text = ', '.join( location_parts )
				if not location_text:
					location_text = str( result.get( 'formatted_address', '' ) or '' ).strip( )
				if not location_text:
					location_text = f'{latitude:.6f}, {longitude:.6f}'
				set_location_state(
					location=location_text,
					city=locality,
					state=region,
					country=str( result.get( 'country_code', '' ) or '' ).strip( ),
					zipcode=str( result.get( 'postal_code', '' ) or '' ).strip( ),
					description='Browser geolocation resolved by reverse geocoding.',
					latitude=latitude,
					longitude=longitude )
			except Exception:
				set_location_state(
					location=f'{latitude:.6f}, {longitude:.6f}',
					city='', state='', country='', zipcode='',
					description='Browser geolocation coordinates.',
					latitude=latitude,
					longitude=longitude )
			
			st.session_state[ 'browser_location_signature' ] = signature
			st.session_state[ 'browser_geolocation_reverse_geocoded' ] = True
			state_changed = True
		else:
			set_coordinates( latitude, longitude )
		
		st.session_state[ 'browser_geolocation' ] = geo_payload
		st.session_state[ 'browser_geolocation_loaded' ] = True
		st.session_state[ 'browser_geolocation_permission_denied' ] = False
		st.session_state[ 'browser_geolocation_error' ] = ''
		st.session_state[ 'active_location_source' ] = 'browser'
		
		if state_changed:
			st.rerun( )
	
	except Exception as ex:
		st.session_state[ 'browser_geolocation_error' ] = str( ex )
'''
          app = replace_function(app, 'bootstrap_browser_geolocation', bootstrap)

          ensure = r'''def ensure_active_location_state( ) -> None:
	"""
	
		Purpose:
		--------
		Apply the active-location priority: browser location first and the most recent
		Geocoding result second. Leave location state empty when neither source is available.
	
		Returns:
		--------
		None
		
	"""
	browser_enabled = bool( st.session_state.get( 'browser_geolocation_enabled', True ) )
	browser_loaded = bool( st.session_state.get( 'browser_geolocation_loaded', False ) )
	browser_geo = st.session_state.get( 'browser_geolocation', None )
	if browser_enabled and browser_loaded and isinstance( browser_geo, dict ):
		coords = browser_geo.get( 'coords', { } ) or { }
		browser_latitude = coords.get( 'latitude', None )
		browser_longitude = coords.get( 'longitude', None )
		if has_valid_coordinates( browser_latitude, browser_longitude ):
			browser_latitude = float( browser_latitude )
			browser_longitude = float( browser_longitude )
			location_text = str( st.session_state.get( 'location', '' ) or '' ).strip( )
			if not location_text or st.session_state.get( 'active_location_source', '' ) != 'browser':
				location_text = f'{browser_latitude:.6f}, {browser_longitude:.6f}'
				set_location_state(
					location=location_text, city='', state='', country='', zipcode='',
					description='Browser geolocation coordinates.',
					latitude=browser_latitude, longitude=browser_longitude )
			else:
				set_coordinates( browser_latitude, browser_longitude )
			st.session_state[ 'active_location_source' ] = 'browser'
			return
	
	geocoded_latitude = st.session_state.get( 'geocoded_latitude', 0.0 )
	geocoded_longitude = st.session_state.get( 'geocoded_longitude', 0.0 )
	if has_valid_coordinates( geocoded_latitude, geocoded_longitude ):
		location_text = str( st.session_state.get( 'geocoded_location', '' ) or '' ).strip( )
		if not location_text:
			location_text = f'{float( geocoded_latitude ):.6f}, {float( geocoded_longitude ):.6f}'
		set_location_state(
			location=location_text, city='', state='', country='', zipcode='',
			description='Geocoding mode location fallback.',
			latitude=float( geocoded_latitude ),
			longitude=float( geocoded_longitude ) )
		st.session_state[ 'active_location_source' ] = 'geocoding'
		return
	
	set_location_state(
		location='', city='', state='', country='', zipcode='', description='' )
	st.session_state[ 'coordinates' ] = ( )
	st.session_state[ 'latitude' ] = 0.0
	st.session_state[ 'longitude' ] = 0.0
	st.session_state[ 'active_location_source' ] = ''
'''
          app = replace_function(app, 'ensure_active_location_state', ensure)

          path.write_text(app, encoding='utf-8')
          PY

      - name: Validate source and run state-contract tests
        run: |
          python -m pip install pyflakes
          python -m compileall -q app.py geocode.py
          set -o pipefail
          pyflakes app.py geocode.py 2>&1 | tee pyflakes.log || true
          if grep -E "undefined name|referenced before assignment" pyflakes.log; then
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import ast

          app_text = Path('app.py').read_text(encoding='utf-8')
          assert 'Washington, DC' not in app_text, 'Washington, DC fallback still exists.'
          assert '38.907200' not in app_text, 'Washington latitude fallback still exists.'
          assert '-77.036900' not in app_text, 'Washington longitude fallback still exists.'

          module = ast.parse(app_text)
          wanted = {'bootstrap_browser_geolocation', 'ensure_active_location_state'}
          nodes = [node for node in module.body if isinstance(node, ast.FunctionDef) and node.name in wanted]
          test_module = ast.Module(body=nodes, type_ignores=[])
          code = compile(ast.fix_missing_locations(test_module), '<location-state-functions>', 'exec')

          class Session(dict):
              def __getattr__(self, name):
                  try:
                      return self[name]
                  except KeyError as exc:
                      raise AttributeError(name) from exc
              def __setattr__(self, name, value):
                  self[name] = value

          class FakeStreamlit:
              def __init__(self, state):
                  self.session_state = state
                  self.rerun_called = False
              def rerun(self):
                  self.rerun_called = True

          def has_valid_coordinates(latitude, longitude):
              try:
                  lat = float(latitude)
                  lon = float(longitude)
              except (TypeError, ValueError):
                  return False
              return -90.0 <= lat <= 90.0 and -180.0 <= lon <= 180.0 and not (lat == 0.0 and lon == 0.0)

          def make_namespace(state, geolocation_payload=None):
              fake_st = FakeStreamlit(state)
              def set_coordinates(latitude, longitude):
                  state['latitude'] = float(latitude)
                  state['longitude'] = float(longitude)
                  state['coordinates'] = (float(latitude), float(longitude))
              def set_location_state(location=None, city=None, state_value=None, country=None, zipcode=None,
                                     description=None, latitude=None, longitude=None, **kwargs):
                  region = kwargs.get('state', state_value)
                  if location is not None: state['location'] = str(location).strip()
                  if city is not None: state['city'] = str(city).strip()
                  if region is not None: state['state'] = str(region).strip()
                  if country is not None: state['country'] = str(country).strip()
                  if zipcode is not None: state['zipcode'] = str(zipcode).strip()
                  if description is not None: state['description'] = str(description).strip()
                  if latitude is not None and longitude is not None: set_coordinates(latitude, longitude)
              def update_location_state_from_browser_geolocation(geo):
                  coords = geo.get('coords', {})
                  if not has_valid_coordinates(coords.get('latitude'), coords.get('longitude')):
                      return False
                  set_location_state(description='Browser geolocation.', latitude=coords['latitude'], longitude=coords['longitude'])
                  state['browser_geolocation'] = geo
                  state['browser_geolocation_loaded'] = True
                  state['browser_geolocation_permission_denied'] = False
                  return True
              ns = {
                  'st': fake_st,
                  'Geocoder': object,
                  'has_valid_coordinates': has_valid_coordinates,
                  'set_coordinates': set_coordinates,
                  'set_location_state': set_location_state,
                  'update_location_state_from_browser_geolocation': update_location_state_from_browser_geolocation,
                  'get_geolocation': lambda: geolocation_payload,
              }
              exec(code, ns)
              return fake_st, ns

          class ArlingtonGeocoder:
              def __init__(self): self.calls = 0
              def reverse(self, latitude, longitude):
                  self.calls += 1
                  assert round(latitude, 4) == 38.8615
                  assert round(longitude, 4) == -77.0634
                  return {
                      'formatted_address': 'Arlington, VA, USA',
                      'locality': 'Arlington',
                      'admin_level_1': 'VA',
                      'country_code': 'US',
                      'postal_code': '22202',
                  }

          # 1. Existing/stale session: browser coordinates are loaded but old Washington text remains.
          state = Session({
              'browser_geolocation_enabled': True,
              'browser_geolocation_loaded': True,
              'browser_geolocation_permission_denied': False,
              'browser_geolocation_reverse_geocoded': True,
              'browser_geolocation': {'coords': {'latitude': 38.861534, 'longitude': -77.063378}},
              'browser_location_signature': '',
              'location': 'Washington, DC',
              'latitude': 38.861534,
              'longitude': -77.063378,
              'coordinates': (38.861534, -77.063378),
              'active_location_source': 'browser',
          })
          fake_st, ns = make_namespace(state)
          geocoder = ArlingtonGeocoder()
          ns['bootstrap_browser_geolocation'](geocoder)
          assert state['location'] == 'Arlington, VA', state
          assert state['active_location_source'] == 'browser', state
          assert geocoder.calls == 1
          assert fake_st.rerun_called

          # 2. Same browser coordinates on next rerun use the resolved signature and do not re-query.
          fake_st.rerun_called = False
          ns['bootstrap_browser_geolocation'](geocoder)
          assert state['location'] == 'Arlington, VA'
          assert geocoder.calls == 1
          assert not fake_st.rerun_called

          # 3. A later Dallas geocode is secondary while browser location remains available.
          state['geocoded_location'] = 'Dallas, TX, USA'
          state['geocoded_latitude'] = 32.7766642
          state['geocoded_longitude'] = -96.7969879
          ns['ensure_active_location_state']()
          assert state['location'] == 'Arlington, VA', state
          assert round(state['latitude'], 4) == 38.8615
          assert state['active_location_source'] == 'browser'

          # 4. With browser unavailable, Dallas becomes the active location.
          state['browser_geolocation_enabled'] = False
          ns['ensure_active_location_state']()
          assert state['location'] == 'Dallas, TX, USA', state
          assert round(state['latitude'], 4) == 32.7767
          assert round(state['longitude'], 4) == -96.7970
          assert state['active_location_source'] == 'geocoding'

          # 5. With neither source available, there is no Washington fallback and stale state is cleared.
          state['geocoded_location'] = ''
          state['geocoded_latitude'] = 0.0
          state['geocoded_longitude'] = 0.0
          ns['ensure_active_location_state']()
          assert state['location'] == '', state
          assert state['coordinates'] == ()
          assert state['latitude'] == 0.0
          assert state['longitude'] == 0.0
          assert state['active_location_source'] == ''

          print('Location-state authority tests passed.')
          PY

      - name: Commit tested production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Correct active location state authority"
          git pull --rebase origin fix/location-state-authority
          git push origin HEAD:fix/location-state-authority
