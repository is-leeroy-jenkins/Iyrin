name: Apply Geocoding State Fix

on:
  push:
    branches:
      - fix/geocoding-widget-state-ci

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Correct geocoding widget state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geocoding-widget-state-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused correction
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')

          old_input = "\t\twith geo_c1:\n\t\t\tquery = st.text_input( 'Enter Address or Location', key='location' )"
          new_input = "\t\twith geo_c1:\n\t\t\tif st.session_state.pop( 'clear_geocoding_location_input', False ):\n\t\t\t\tst.session_state[ 'geocoding_location_input' ] = ''\n\t\t\t\n\t\t\tif 'geocoding_location_input' not in st.session_state:\n\t\t\t\tst.session_state[ 'geocoding_location_input' ] = get_global_location_default( )\n\t\t\t\n\t\t\tquery = st.text_input( 'Enter Address or Location', key='geocoding_location_input' )"
          if old_input not in app:
              raise SystemExit('Geocoding input anchor not found.')
          app = app.replace(old_input, new_input, 1)

          old_clear = "\t\t\twith btn_c2:\n\t\t\t\tif st.button( label='Clear Location', width='stretch', icon='🧹' ):\n\t\t\t\t\tst.info( 'Use Ctrl+A / Backspace to clear the location field.' )"
          new_clear = "\t\t\twith btn_c2:\n\t\t\t\tif st.button( label='Clear Location', width='stretch', icon='🧹' ):\n\t\t\t\t\tst.session_state[ 'clear_geocoding_location_input' ] = True\n\t\t\t\t\tst.rerun( )"
          if old_clear not in app:
              raise SystemExit('Clear Location anchor not found.')
          app = app.replace(old_clear, new_clear, 1)
          app_path.write_text(app, encoding='utf-8')
          PY
      - name: Validate focused correction
        run: |
          python -m pip install pyflakes
          python -m compileall -q app.py fetchers.py pipelines.py processors.py loaders.py generators.py
          set -o pipefail
          pyflakes app.py pipelines.py processors.py loaders.py fetchers.py generators.py 2>&1 | tee pyflakes.log || true
          if grep -E "undefined name|referenced before assignment" pyflakes.log; then
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          required = [
              "key='geocoding_location_input'",
              "st.session_state[ 'clear_geocoding_location_input' ] = True",
              "set_location_state(\n\t\t\tlocation=query,",
          ]
          missing = [value for value in required if value not in app]
          if missing:
              raise SystemExit(f'Missing geocoding state correction(s): {missing}')
          if "st.text_input( 'Enter Address or Location', key='location' )" in app:
              raise SystemExit('Stale geocoding widget key remains.')
          print('Geocoding widget state contract validated.')
          PY
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Correct geocoding widget state"
          git push origin HEAD:fix/geocoding-widget-state-ci
