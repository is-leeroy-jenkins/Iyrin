name: Audit App Execution Paths

on:
  push:
    branches:
      - fix/app-execution-path-audit
    paths:
      - .github/workflows/audit-app-execution-paths.yml
      - .github/scripts/fix_app_execution_paths.py

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-execution-path-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply execution-path repairs
        run: python .github/scripts/fix_app_execution_paths.py

      - name: Compile production Python
        run: python -m py_compile app.py processing.py processors.py generators.py loaders.py

      - name: Install static analyzer
        run: python -m pip install --disable-pip-version-check pyflakes

      - name: Reject undefined names
        shell: bash
        run: |
          set +e
          output=$(pyflakes app.py 2>&1)
          status=$?
          set -e
          echo "$output"
          undefined=$(printf '%s\n' "$output" | grep 'undefined name' || true)
          if [ -n "$undefined" ]; then
            echo "$undefined"
            exit 1
          fi
          exit 0

      - name: Verify mode and processing contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import config as cfg

          app_text = Path( 'app.py' ).read_text( encoding='utf-8' )
          processing_text = Path( 'processing.py' ).read_text( encoding='utf-8' )
          app_tree = ast.parse( app_text )
          processing_tree = ast.parse( processing_text )

          discovered = set( )
          for node in ast.walk( app_tree ):
              if isinstance( node, ast.Compare ) and isinstance( node.left, ast.Name ) and node.left.id == 'mode':
                  for comparator in node.comparators:
                      if isinstance( comparator, ast.Constant ) and isinstance( comparator.value, str ):
                          discovered.add( comparator.value )
          missing_modes = [ mode for mode in cfg.MODES if mode not in discovered ]
          if missing_modes:
              raise RuntimeError( f'Missing mode execution paths: {missing_modes}' )

          signatures = { }
          for node in processing_tree.body:
              if isinstance( node, ast.FunctionDef ):
                  positional = len( node.args.posonlyargs ) + len( node.args.args )
                  required = positional - len( node.args.defaults )
                  signatures[ node.name ] = ( required, positional )

          errors = [ ]
          for node in ast.walk( app_tree ):
              if not isinstance( node, ast.Call ) or not isinstance( node.func, ast.Name ):
                  continue
              if node.func.id not in signatures:
                  continue
              required, maximum = signatures[ node.func.id ]
              supplied = len( node.args ) + len( [ kw for kw in node.keywords if kw.arg is not None ] )
              if supplied < required or supplied > maximum:
                  errors.append( f'line {node.lineno}: {node.func.id} supplied={supplied} required={required} max={maximum}' )
          if errors:
              raise RuntimeError( '\n'.join( errors ) )

          forbidden = [
              "st.sessionn_state",
              "df_tables[ 'name' ].tolist( )[ :3 ]",
              "os.environ[ 'AIRNOW_API_KEY' ] = openaq_key",
              "value=st.session_state.opensky_api_client_id or '',\n\t\t\thelp='Overrides FIRMS_MAP_KEY",
              "st.session_state.purpleair_key = purpleair_key",
              '_invoke_provider(',
          ]
          for token in forbidden:
              if token in app_text:
                  raise RuntimeError( f'Forbidden runtime defect remains: {token}' )

          required_symbols = [
              'render_document_processing_inputs', 'render_document_processing_actions',
              'reset_document_processing_controls', 'clear_if_active',
              'rebuild_raw_text_from_documents', 'render_loading_tabs',
              'render_document_processing_controls',
          ]
          for symbol in required_symbols:
              if f'def {symbol}(' not in processing_text:
                  raise RuntimeError( f'Missing processing implementation: {symbol}' )

          print( f'Validated {len( discovered )} mode execution paths and processing contracts.' )
          PY

      - name: Verify sidebar data-source contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path( 'app.py' ).read_text( encoding='utf-8' )
          required = [
              "df_default = pd.DataFrame( )",
              "df_original: pd.DataFrame | None = None",
              "store_loaded_dataset( df_default, df_original )",
              "st.session_state[ 'map_mode_table' ] = selected_table",
              "table_options = df_tables[ 'name' ].tolist( )",
          ]
          for contract in required:
              if contract not in app:
                  raise RuntimeError( f'Missing data-source contract: {contract}' )
          PY

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add app.py processing.py processors.py requirements.txt
          if git diff --cached --quiet; then
            echo 'No production repairs detected.'
            exit 1
          fi
          git commit -m 'Correct app execution path runtime errors'
          git push origin fix/app-execution-path-audit
