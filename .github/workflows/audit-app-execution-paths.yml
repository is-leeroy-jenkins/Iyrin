name: Audit App Execution Paths

on:
  push:
    branches:
      - fix/app-execution-path-audit
    paths:
      - .github/workflows/audit-app-execution-paths.yml
      - app.py

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-execution-path-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile app
        run: python -m py_compile app.py

      - name: Install static analyzers
        run: python -m pip install --disable-pip-version-check pyflakes

      - name: Undefined-name audit
        run: pyflakes app.py
