name: Update Tonight Button Colors

on:
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/whats-up-tonight-colors
          fetch-depth: 0

      - name: Update interaction colors
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("assets/starmap/style.css")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              "\tbackground: rgba(0, 120, 252, 0.16);\n\tborder-color: var(--primary-light);",
              "\tbackground: #2B3139;\n\tborder-color: #4B5563;",
              1,
          )
          source = source.replace(
              "\tbox-shadow: 0 6px 16px rgba(0, 120, 252, 0.28);",
              "\tbox-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);",
              1,
          )
          source = source.replace(
              "\tbackground: rgba(0, 120, 252, 0.28);\n\tborder-color: var(--primary);\n\tbox-shadow: 0 2px 6px rgba(0, 0, 0, 0.35) inset;",
              "\tbackground: var(--primary-dark);\n\tborder-color: var(--primary);\n\tcolor: white;\n\tbox-shadow: 0 2px 6px rgba(0, 0, 0, 0.4) inset;",
              1,
          )
          source = source.replace(
              "\toutline: none;\n\tbox-shadow: 0 0 0 3px rgba(77, 163, 255, 0.32);",
              "\toutline: none;\n\tbackground: var(--primary-dark);\n\tborder-color: var(--primary);\n\tcolor: white;\n\tbox-shadow: 0 0 0 3px rgba(0, 87, 184, 0.45);",
              1,
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q '#2B3139' assets/starmap/style.css
          grep -q 'rgba(0, 87, 184, 0.45)' assets/starmap/style.css

      - name: Remove temporary workflow
        run: rm .github/workflows/update-whats-up-tonight-colors.yml

      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add assets/starmap/style.css .github/workflows/update-whats-up-tonight-colors.yml
          git diff --cached --check
          git commit -m "Adjust Tonight button interaction colors"
          git push origin ui/whats-up-tonight-colors
