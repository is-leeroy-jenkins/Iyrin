name: Audit Requested Modes

on:
  push:
    branches:
      - fix/geocoding-fetcher-ui-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static analysis
        run: python -m pip install pyflakes
      - name: Compile application modules
        run: python -m compileall -q app.py fetchers.py pipelines.py processors.py loaders.py generators.py
      - name: Check undefined names
        run: |
          set -o pipefail
          pyflakes app.py fetchers.py pipelines.py processors.py loaders.py generators.py 2>&1 | tee pyflakes.log || true
          if grep -E 'undefined name|referenced before assignment' pyflakes.log; then
            exit 1
          fi
      - name: Validate requested contracts
        run: python .github/scripts/final_validate_requested_changes.py
