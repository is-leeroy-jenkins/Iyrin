name: Fix Tonight Button Pointer Events

on:
  push:
    branches:
      - fix/whats-up-tonight-pointer-events
    paths:
      - .github/workflows/fix-whats-up-tonight-pointer-events.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whats-up-tonight-pointer-events
          fetch-depth: 0
      - name: Fix interaction layer
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('assets/starmap/style.css'); s=p.read_text(); s=s.replace('\\tz-index: 0;\\n}\\n\\n.form-group','\\tz-index: 0;\\n\\tpointer-events: none;\\n}\\n\\n.form-group',1); s=s.replace('.button-group\\n{\\n\\tmargin-bottom: 2rem;\\n}','.button-group\\n{\\n\\tmargin-bottom: 2rem;\\n\\tposition: relative;\\n\\tz-index: 1;\\n}',1); p.write_text(s)"
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q "pointer-events: none;" assets/starmap/style.css
          grep -A 5 "^.button-group" assets/starmap/style.css | grep -q "z-index: 1;"
          grep -q 'id="whatUpTonightBtn" class="secondary-btn"' assets/starmap/index.html
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-whats-up-tonight-pointer-events.yml
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/starmap/style.css .github/workflows/fix-whats-up-tonight-pointer-events.yml
          git diff --cached --check
          git commit -m "Fix What's Up Tonight pointer interaction"
          git push origin fix/whats-up-tonight-pointer-events
