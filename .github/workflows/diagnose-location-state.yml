name: Diagnose Location State

on:
  push:
    branches:
      - fix/location-state-authority

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect location-state code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.py').read_text(encoding='utf-8')
          print('WASHINGTON_OCCURRENCES', app.count('Washington, DC'))
          for index, line in enumerate(app.splitlines(), 1):
              if 'Washington, DC' in line or '38.907200' in line or '-77.036900' in line:
                  print(f'{index}: {line}')

          for name in ['get_global_location_default', 'get_global_latitude_default', 'get_global_longitude_default', 'bootstrap_browser_geolocation', 'ensure_active_location_state', 'append_geocoding_map_result']:
              match = re.search(rf'^def {name}\(.*?(?=^def |^# =|^# -|^elif mode ==|^if mode ==|\Z)', app, re.M | re.S)
              print(f'\n===== {name} =====')
              print(match.group(0)[:12000] if match else 'NOT FOUND')

          print('\n===== BOOTSTRAP CALLS =====')
          for index, line in enumerate(app.splitlines(), 1):
              if 'bootstrap_browser_geolocation' in line or 'ensure_active_location_state' in line:
                  print(f'{index}: {line}')
          PY
